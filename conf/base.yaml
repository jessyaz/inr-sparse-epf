seed: 0
device: auto
out_dir: ./runs

dataset:
  processed_dir: ./data/processed
  batch_size: 64
  num_workers: 4

window:
  lookback: 168
  horizon: 24
  stride_train: 24
  stride_eval: 24

train:
  num_epochs: 300
  patience: 30
  warmup_steps: 0
  grad_clip: 0.0
  lr: 1e-3
  weight_decay: 0.0

evaluation:
  rates: [0.3, 0.5, 0.7, 0.9, 0.95]
  mask_seeds: [0, 1, 2, 3, 4]
